name: Publish prepared Palm Remote APK
on:
  push:
    branches: [main]
    paths:
      - 'downloads/PalmRemote-1.6.3.apk.xz'
      - '.github/workflows/publish-prepared-apk.yml'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore the validated, signed APK
        run: |
          xz --decompress --stdout downloads/PalmRemote-1.6.3.apk.xz > downloads/PalmRemote.apk
          echo '88e53b2a9a6243695bdaa613e041876ccada579b8a50357d34177f9070542d74  downloads/PalmRemote.apk' | sha256sum --check
          printf '88e53b2a9a6243695bdaa613e041876ccada579b8a50357d34177f9070542d74  PalmRemote.apk\n' > downloads/SHA256SUMS
      - name: Package source files
        shell: python
        run: |
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('downloads/PalmRemote-1.6.3-source.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for name in paths:
                  if not name:
                      continue
                  path = pathlib.Path(name)
                  if any(part in ('downloads', 'screenshots', '__pycache__') for part in path.parts):
                      continue
                  archive.write(path, 'PalmRemote-1.6.3/' + name)
      - name: Save downloadable files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/PalmRemote.apk downloads/PalmRemote-1.6.3-source.zip downloads/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated Palm Remote 1.6.3 APK and source archive'
            git push origin HEAD:main
          fi
