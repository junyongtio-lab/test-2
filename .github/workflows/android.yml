name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: |
          mkdir -p work
          PALM_EXPANDED_WAVEFORMS="$PWD/work/ac112-waveforms.csv" ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify expanded AC packets and strict waveform decodes
        run: |
          git init work/ac-reference
          git -C work/ac-reference remote add origin https://github.com/crankyoldgit/IRremoteESP8266.git
          git -C work/ac-reference fetch --depth 1 origin 1e2f0f3ef0a93cbf2a8ddb2e95130f8f4c584b3f
          git -C work/ac-reference checkout --detach FETCH_HEAD
          python3 tools/ac_expanded/verify_reference.py --reference work/ac-reference --waveforms work/ac112-waveforms.csv
      - name: Verify TV brand coverage
        run: python3 tools/tv_brand_coverage.py --check
      - name: Verify decoder brand coverage
        run: python3 tools/decoder_brand_coverage.py --check
      - name: Verify fan brand coverage
        run: python3 tools/fan_brand_coverage.py --check
      - name: Verify AC guided coverage and encoder gaps
        run: python3 tools/ac_guided_coverage.py --check
      - name: Verify Mi database catalogue
        run: |
          python3 -m pip install -r tools/mi_catalogue/requirements.txt
          python3 tools/mi_catalogue/generate.py --check
          python3 -m unittest discover -s tools/mi_catalogue -p 'test_*.py' -v
      - name: Verify static APK research tools
        run: python3 -m unittest discover -s tools/apk_inspection -p 'test_*.py' -v
      - name: Verify bundled Astro keysets
        run: |
          python3 tools/mi_stb/generate_stb.py --check
          python3 -m unittest discover -s tools/mi_stb -p 'test_*.py' -v
      - name: Verify imported Mi APK data and TV matching
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev
          python3 -m pip install -r tools/mi_apk_catalogue/requirements.txt
          python3 tools/mi_apk_catalogue/generate_apk.py --check
          python3 -m unittest discover -s tools/mi_apk_catalogue -p 'test_*.py' -v
          python3 tools/mi_matching/generate_order.py --check
          python3 -m unittest discover -s tools/mi_matching -p 'test_*.py' -v
          python3 tools/panasonic_ac/generate.py --check
          python3 -m unittest discover -s tools/panasonic_ac -p 'test_*.py' -v
          python3 tools/panasonic_ac/verify_sources.py
          python3 tools/mi_ac_database/generate.py --check
          python3 -m unittest discover -s tools/mi_ac_database -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: PalmRemote-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
