name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify native AC encoders and TV profile facts
        run: |
          bash native_ir/tests/ac/run.sh
          python3 native_ir/tests/ac/profile_catalog.py --check
          python3 -m unittest discover -s native_ir/tests -p 'test_tv_extra.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: PalmRemote-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
