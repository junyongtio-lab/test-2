name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify Mi database catalogue
        run: |
          python3 -m pip install -r tools/mi_catalogue/requirements.txt
          python3 tools/mi_catalogue/generate.py --check
          python3 -m unittest discover -s tools/mi_catalogue -p 'test_*.py' -v
      - name: Verify static APK research tools
        run: python3 -m unittest discover -s tools/apk_inspection -p 'test_*.py' -v
      - name: Verify bundled Astro keysets
        run: |
          python3 tools/mi_stb/generate_stb.py --check
          python3 -m unittest discover -s tools/mi_stb -p 'test_*.py' -v
      - name: Verify imported Mi APK data and TV matching
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev
          python3 -m pip install -r tools/mi_apk_catalogue/requirements.txt
          python3 tools/mi_apk_catalogue/generate_apk.py --check
          python3 -m unittest discover -s tools/mi_apk_catalogue -p 'test_*.py' -v
          python3 tools/mi_matching/generate_order.py --check
          python3 -m unittest discover -s tools/mi_matching -p 'test_*.py' -v
          python3 tools/panasonic_ac/generate.py --check
          python3 -m unittest discover -s tools/panasonic_ac -p 'test_*.py' -v
          python3 tools/panasonic_ac/verify_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: PalmRemote-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
