plugins { id 'com.android.application' }

android {
    namespace 'com.universalremote.app'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.universalremote.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
        testInstrumentationRunner 'com.universalremote.app.ac.AcEngineInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
}
