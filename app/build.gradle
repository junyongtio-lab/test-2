plugins { id 'com.android.application' }

android {
    namespace 'com.universalremote.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.universalremote.app'
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName '1.6.6'
        testInstrumentationRunner 'com.universalremote.app.CatalogInstrumentation'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
}

tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    if (name == 'testDebugUnitTest') {
        ['PALM_EXPANDED_WAVEFORMS', 'PALM_AC112_CONTROLS_WAVEFORMS'].each { variable ->
            def waveformPath = System.getenv(variable)
            if (waveformPath) { environment variable, waveformPath; outputs.file(waveformPath) }
        }
    }
}

